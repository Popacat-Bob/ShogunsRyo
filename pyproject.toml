[project]
name = "shogunsryo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Popacat-Bob", email = "gdloyola9@gmail.com" }
]
# PaddlePaddle 3.2.0 has Windows wheels for Python 3.12 only (of the versions we use)
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.28.0",
    "groq>=1.7.0",
    "mouseinfo>=0.1.3",
    "mss>=10.2.0",
    # CUDA libraries for the GPU build of PaddlePaddle (Windows doesn't bundle them)
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "opencv-contrib-python>=4.8",
    "paddleocr>=3.0",
    "paddlepaddle-gpu==3.2.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2; sys_platform == 'win32'",
    "pyautogui>=0.9.54",
    "pynput>=1.8.2",
    "pywin32>=312; sys_platform == 'win32'",
]

[project.scripts]
shogunsryo = "shogunsryo:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# ---- Windows + NVIDIA GPU ----------------------------------------------------
# cu126 needs an NVIDIA driver 550.54 or newer (check with: nvidia-smi).
# No NVIDIA GPU? Replace "paddlepaddle-gpu==3.2.0" above with "paddlepaddle>=3.0",
# and delete the nvidia-* lines and everything below this line.
[tool.uv]
environments = ["sys_platform == 'win32'"]

# PaddleOCR brings its own OpenCV (opencv-contrib-python). Two OpenCV packages in one
# environment overwrite each other's files and break "import cv2", so keep exactly one.
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true
